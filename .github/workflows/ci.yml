# Tests. Runs on pull requests and is reused by release.yml before every build.
name: CI

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Each OS also proves the bundled SQLite binary for that platform loads.
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # better-sqlite3 ships prebuilt N-API binaries, so no install scripts
      # (and no native compilation) are needed.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Unit and integration tests
        run: npm test

  e2e:
    name: End-to-end test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Drive the real app with Playwright
        run: npm run test:e2e

      # Same run with animation frames arriving late (worst case of a throttled
      # window): catches UI code that moves focus a frame late and steals keystrokes.
      - name: Drive the real app with late animation frames
        run: npm run test:e2e
        env:
          E2E_LATE_FRAMES: '1'

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots
          path: |
            e2e/screenshots/
            e2e/screenshots-late-frames/
          if-no-files-found: ignore
          retention-days: 7
